[General]
device_name = WA
device_name_os = watch_agent

[Vibration]
vibrator_duration_path = /sys/class/leds/vibrator/duration
vibrator_activate_path = /sys/class/leds/vibrator/activate
vibrator_gain_path = /sys/class/leds/vibrator/gain

vibration_duration_ms = 100
vibration_delay_ms = 250
vibration_gain = 255

[HeartSensor]
service = com.nokia.SensorService
manager_path = /SensorManager
sensor_path = /SensorManager/hrmsensor
sensor_name = hrmsensor
socket_path = /var/run/sensord.sock
sensor_manager_local = local.SensorManager
sensor_local = local.HrmSensor

max_attempts = 5
attemps_delay = 1.0

measurements_delay = 30.0
measurements_time = 20.0

[Buttons]
button_dev = /dev/input/event0
event_format = 4s4sHHI

[Bluethooth]
service_uuid = FFE0
timeout_receive_time = 5

advertisement = org.bluez.LEAdvertisement1
advertisement_path = /org/bluez/watch/advertisement0
advertisement_manager = org.bluez.LEAdvertisingManager1
adapter_path = /org/bluez/hci0
bluez_general_path = org.bluez
bluez_adapter_path = org.bluez.Adapter1
bluez_device_path = org.bluez.Device1

[DBus]
properties = org.freedesktop.DBus.Properties
object_manager = org.freedesktop.DBus.ObjectManager

[Battery]
service = com.nokia.mce
request_path = /com/nokia/mce/request
request_service = com.nokia.mce.request

[Logs]
logs_path = logs.txt
max_size_kb = 5000
max_backups = 2

[OS]
wake_lock_path = /sys/power/wake_lock
wake_unlock_path = /sys/power/wake_unlock